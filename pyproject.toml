[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-consent-gate"
version = "0.1.0"
description = "Ask-before-acting for Model Context Protocol tools: elicitation-based consent bound to an action digest, code fallback, audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ritish Kurma" }]
dependencies = ["mcp>=2.0", "pydantic>=2", "anyio>=4"]
keywords = ["mcp", "model-context-protocol", "elicitation", "consent", "human-in-the-loop", "agents"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_consent_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
